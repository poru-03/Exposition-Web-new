<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="fosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0F3"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C0F3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Camera / Shutter Icon Glyph -->
  <g transform="translate(45, 45)" filter="url(#glow)">
    <circle cx="55" cy="55" r="48" fill="none" stroke="url(#fosGrad)" stroke-width="6"/>
    <circle cx="55" cy="55" r="32" fill="#0C0C0C" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <!-- Shutter Blades -->
    <path d="M55 23 L63 55 M83 40 L58 66 M83 70 L48 65 M55 87 L47 55 M27 70 L52 44 M27 40 L62 45" stroke="url(#fosGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="55" cy="55" r="14" fill="url(#fosGrad)"/>
    <circle cx="50" cy="50" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <g transform="translate(180, 75)">
    <!-- "FOS" -->
    <text x="0" y="32" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="3">
      FOS
    </text>
    <!-- "MEDIA" -->
    <text x="135" y="32" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="url(#fosGrad)" letter-spacing="3">
      MEDIA
    </text>
    
    <!-- Subtitle -->
    <text x="4" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="4.5">
      PHOTOGRAPHY &amp; MEDIA
    </text>
  </g>
</svg>
